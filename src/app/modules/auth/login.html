    <div class="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 dark:bg-slate-950 transition-colors">
      <div class="absolute top-8 right-8">
        <button (click)="theme.toggleDarkMode()" class="p-3 rounded-full bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400">
          <mat-icon>{{ theme.darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>

      <div class="w-full max-w-md">
        <div class="flex flex-col items-center mb-8">
          <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
            <mat-icon class="text-black scale-150">delivery_dining</mat-icon>
          </div>
          <h1 class="text-3xl font-display font-bold text-slate-900 dark:text-white">Kall me</h1>
          <p class="text-slate-500 dark:text-slate-400">Food Delivery Management System</p>
        </div>

        <div class="card p-8">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary/10 text-primary mb-4">
              <mat-icon>admin_panel_settings</mat-icon>
            </div>
            <h2 class="text-xl font-semibold text-slate-900 dark:text-white">Admin Login</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">Enter your credentials to access the dashboard</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
              <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
              <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                  <mat-icon class="text-lg">mail</mat-icon>
                </span>
                <input 
                  id="email"
                  type="email" 
                  formControlName="email"
                  class="input-field pl-12" 
                  placeholder="name@kallme.com"
                >
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                <a href="#" class="text-sm text-primary font-medium hover:underline">Forgot?</a>
              </div>
              <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                  <mat-icon class="text-lg">lock</mat-icon>
                </span>
                <input 
                  id="password"
                  [type]="showPassword() ? 'text' : 'password'" 
                  formControlName="password"
                  class="input-field pl-12 pr-12" 
                  placeholder="••••••••"
                >
                <button type="button" (click)="showPassword.set(!showPassword())" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary">
                  <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </div>
            </div>

            <button 
              type="submit" 
              [disabled]="loginForm.invalid || loading"
              class="btn-primary w-full py-4 flex items-center justify-center gap-2"
            >
              @if (loading) {
                <div class="w-5 h-5 border-2 border-black/20 border-t-black rounded-full animate-spin"></div>
              } @else {
                Sign In
              }
            </button>
          </form>

          <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
            <p class="text-xs text-slate-400 uppercase tracking-widest font-medium">Internal Access Only</p>
          </div>
        </div>

        <div class="mt-8 flex justify-center gap-6 text-sm text-slate-500 dark:text-slate-400">
          <a href="#" class="hover:text-primary">Privacy Policy</a>
          <a href="#" class="hover:text-primary">Terms of Service</a>
          <a href="#" class="hover:text-primary">Help Center</a>
        </div>
      </div>
    </div>
